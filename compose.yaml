# =============================================================================
# matrix-proxy v1.3 — Hardened Docker Compose Example
# Quick start:
#   cp config.example.toml config.toml
#   docker compose up -d
# =============================================================================
services:
  matrix-proxy:
    # Available from both Docker Hub and GitHub Container Registry (GHCR):
    #   - utoptop/matrix-proxy:1.0  (or :latest)
    #   - ghcr.io/utoptop/matrix-proxy:latest
    image: utoptop/matrix-proxy:1.0
    container_name: matrix-proxy
    restart: unless-stopped
    # Security hardening: read-only rootfs, drop all Linux capabilities, prevent privilege escalation
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bind to localhost behind Nginx/HAProxy/Caddy, or bind to your Tailscale IP (e.g. 100.64.0.10:8081:8081)
    # for direct domainless `http://ip:port` access without TLS certificates.
    ports:
      - "127.0.0.1:8910:8080"
      # - "100.64.0.10:8081:8081"
    environment:
      RUST_LOG: "${RUST_LOG:-matrix_proxy=info}"
      # For zero-TOML single-upstream deployments, uncomment below and remove `volumes`:
      # MATRIX_PROXY_PUBLIC_URL: "${MATRIX_PROXY_PUBLIC_URL:-https://proxy.example.com}"
      # UPSTREAM_MATRIX_SERVER_URL: "${UPSTREAM_MATRIX_SERVER_URL:-https://matrix.example.org}"
      # UPSTREAM_MATRIX_AUTH_URL: "${UPSTREAM_MATRIX_AUTH_URL:-https://auth.example.org}"
      # UPSTREAM_MATRIX_RTC_URL: "${UPSTREAM_MATRIX_RTC_URL:-}"
      # OUTBOUND_PROXY: "${OUTBOUND_PROXY:-}"
      # OUTBOUND_NO_PROXY: "${OUTBOUND_NO_PROXY:-}"
      # CLIENT_IP_MODE: "${CLIENT_IP_MODE:-replace}"
      # UPSTREAM_PROXY_PROTOCOL: "${UPSTREAM_PROXY_PROTOCOL:-off}"
      # EXPOSE_INFO: "${EXPOSE_INFO:-trusted}"
    volumes:
      # Mounting the directory to `/app/conf:ro` (auto-loads `/app/conf/config.toml`) ensures
      # editors/SFTP clients that perform atomic write+rename trigger automatic hot reload cleanly.
      - ./:/app/conf:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
