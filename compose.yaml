# =============================================================================
# matrix-proxy — Hardened Docker Compose Example
# Quick start:
#   cp config.example.toml config.toml
#   docker compose up -d
# =============================================================================
services:
  matrix-proxy:
    image: utoptop/matrix-proxy:1.0
    container_name: matrix-proxy
    restart: unless-stopped
    # Security hardening: read-only rootfs, drop all Linux capabilities, prevent privilege escalation
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bind to localhost only and terminate TLS via Nginx, HAProxy, Caddy, or Envoy.
    # Add extra port mappings if any [[proxies]] block uses a dedicated `listen` port (e.g. 8081).
    ports:
      - "127.0.0.1:8910:8080"
      # - "127.0.0.1:8911:8081"
    environment:
      RUST_LOG: "${RUST_LOG:-matrix_proxy=info}"
      # For zero-TOML single-upstream deployments, uncomment below and remove `volumes`:
      # PUBLIC_URL: "${PUBLIC_URL:-https://proxy.example.com}"
      # MATRIX_UPSTREAM: "${MATRIX_UPSTREAM:-https://matrix.example.org}"
      # AUTH_UPSTREAM: "${AUTH_UPSTREAM:-https://auth.example.org}"
      # RTC_UPSTREAM: "${RTC_UPSTREAM:-}"
      # UPSTREAM_PROXY: "${UPSTREAM_PROXY:-}"
      # CLIENT_IP_MODE: "${CLIENT_IP_MODE:-replace}"
      # PROXY_PROTOCOL: "${PROXY_PROTOCOL:-off}"
      # EXPOSE_INFO: "${EXPOSE_INFO:-trusted}"
    volumes:
      # Mounting the directory to `/app/conf:ro` (auto-loads `/app/conf/config.toml`) ensures
      # editors/SFTP clients that perform atomic write+rename trigger automatic hot reload cleanly.
      - ./:/app/conf:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
