[package]
name = "matrix-proxy"
version = "1.6.0"
edition = "2024"
description = "High-performance multi-tenant Rust reverse proxy for Matrix Client-Server & Matrix Auth (MAS/OIDC) with edge media caching & proactive preloading, auto-discovery, HTTP/IP:port & Tailscale support, global HTTP/SOCKS5 outbound proxy, zero-downtime hot reload, and standard PROXY Protocol v1/v2"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
brotli = { version = "9", default-features = false, features = ["std"] }
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
futures-util = "0.3"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
ipnet = "2.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream", "socks", "json", "gzip", "brotli", "deflate", "http2"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
ruzstd = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.44", features = ["fs", "macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
webpki-roots = "0.26"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
